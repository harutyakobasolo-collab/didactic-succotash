services:
  mock-api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 10

  api-tests:
    build: .
    depends_on:
      mock-api:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
    command:
      - sdetflow
      - examples/ecommerce/cases.yaml
      - --env
      - examples/ecommerce/environment.yaml
      - --base-url
      - http://mock-api:8000

